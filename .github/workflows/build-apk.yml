name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Создать публичный Release (прямая ссылка для друзей)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore debug keystore and environment
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Prepare APK file
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/StudySync.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StudySync-APK
          path: dist/StudySync.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.create_release == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v1.0"
          gh release view "$tag" >/dev/null 2>&1 && is_exist=true || is_exist=false
          if [ "$is_exist" = "true" ]; then
            gh release upload "$tag" dist/StudySync.apk --clobber
          else
            gh release create "$tag" dist/StudySync.apk \
              --title "StudySync v1.0" \
              --notes "Актуальная сборка приложения StudySync для Android. Скачайте StudySync.apk и установите на телефон."
          fi

